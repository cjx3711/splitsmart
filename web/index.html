<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0e1214" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f9f8" media="(prefers-color-scheme: light)" />
    <!--
      The public shell: landing, about, changelog, API docs. Deliberately NOT the PWA and
      deliberately not the app: no session lookup, no service worker, nothing
      to install. The app lives at /app and the guest shell at /guest.
    -->
    <title>SplitSmart — Keep track of who paid for dinner.</title>
    <meta
      name="description"
      content="A Splitwise replacement you can run yourself. Groups, friends, one-off bills, 100+ currencies, offline support, and a free API. No account needed to settle a trip."
    />
    <!--
      Share cards. Crawlers do not run JS, so these have to live in this
      document rather than in React. __APP_ORIGIN__ is rewritten to APP_ORIGIN
      when Hono serves the built file (src/server.ts); Telegram, iMessage and
      Slack will not fetch a relative og:image. /og.png is a 1200×630 (2×)
      screenshot of the hero — recapture it against yarn dev if the landing
      page changes.
    -->
    <link rel="canonical" href="__APP_ORIGIN__/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SplitSmart" />
    <meta property="og:title" content="SplitSmart — Keep track of who paid for dinner." />
    <meta
      property="og:description"
      content="A Splitwise replacement you can run yourself. Groups, friends, one-off bills, 100+ currencies, offline support, and a free API. No account needed to settle a trip."
    />
    <meta property="og:url" content="__APP_ORIGIN__/" />
    <meta property="og:image" content="__APP_ORIGIN__/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta
      property="og:image:alt"
      content="SplitSmart — Keep track of who paid for dinner."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SplitSmart — Keep track of who paid for dinner." />
    <meta
      name="twitter:description"
      content="A Splitwise replacement you can run yourself. Groups, friends, one-off bills, 100+ currencies, offline support, and a free API. No account needed to settle a trip."
    />
    <meta name="twitter:image" content="__APP_ORIGIN__/og.png" />
    <!--
      Deploy-only, opt-in telemetry hook. web/public/telemetry.js is a
      committed no-op stub; see scripts/deploy/README.md.
    -->
    <script defer src="/telemetry.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entry-marketing.tsx"></script>
  </body>
</html>
